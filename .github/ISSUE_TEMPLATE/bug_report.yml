name: Bug report
description: Report a reproducible failure with device and build details.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App version or commit, build variant, device model, OS/API, and network conditions. Redact personal data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the starting state and remote-control sequence.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and observed behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and regression context
      description: Sanitised logs, screenshots, frequency, last working build, and related acceptance-case IDs.
