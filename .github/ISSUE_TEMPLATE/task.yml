name: Scoped task
description: Define one reviewable piece of work and its acceptance criteria.
title: "task: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and scope
      description: Describe the affected component, user outcome, and scope boundaries.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, verifiable outcomes and identify any required decisions.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and regression coverage
      description: Identify the relevant tests, devices, evidence, and recovery steps.
    validations:
      required: true
