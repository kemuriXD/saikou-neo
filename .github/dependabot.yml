version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    groups:
      actions-compatible-updates:
        update-types:
          - minor
          - patch
