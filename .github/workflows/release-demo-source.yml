name: Release demo source

# Run this from the Actions tab to release the demo source version in
# gradle.properties (ADR 0026). It builds a signed APK and attaches it to a new
# GitHub release as source.apk, the way the extension template does. Its link is
# what you add in Saikou Neo. The release isn't marked latest, so it never
# stands in for an app release. The signing key and its password are repository
# secrets.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-demo-source
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check this version isn't released yet
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep '^demoSource.version=' gradle.properties | cut -d= -f2-)"
          tag="demo-source-v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Demo source $version is already released. Raise demoSource.version in gradle.properties first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEMO_SOURCE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The DEMO_SOURCE_KEYSTORE_BASE64 and DEMO_SOURCE_KEYSTORE_PASSWORD secrets are missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Fails if gradle-wrapper.jar doesn't match a published Gradle release.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # DEMO_SOURCE_KEY_ALIAS and DEMO_SOURCE_KEY_PASSWORD are only needed for a
      # key made differently from the extension template's README.
      - name: Test and build
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.DEMO_SOURCE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.DEMO_SOURCE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.DEMO_SOURCE_KEY_PASSWORD }}
        run: ./gradlew :demo-source:testDebugUnitTest :demo-source:assembleRelease

      # Only a signed build is named demo-source-release.apk, so an unsigned one stops here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp demo-source/build/outputs/apk/release/demo-source-release.apk "$RUNNER_TEMP/source.apk"
          link="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/source.apk"
          notes="Plays public test streams, for testing playback. Add it in Saikou Neo under Settings > Sources with $link"
          gh release create "$TAG" "$RUNNER_TEMP/source.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Demo source ${TAG#demo-source-v}" --notes "$notes" --latest=false
          rm -f "$RUNNER_TEMP/release.jks"
