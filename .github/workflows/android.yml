name: Android

# PRs must be up to date with main before merging, so a run after the merge
# would repeat a tested tree. Main only builds when the build setup changes,
# plus once a week, to refresh the cache that PRs restore (ADR 0010). PRs that
# only change docs skip the build but still report (ADR 0015).
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - gradle/**
      - gradle.properties
      - "**/*.gradle.kts"
      - build-logic/**
      - .github/workflows/android.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the app needs building. A PR that only changes docs,
  # licences or GitHub templates doesn't. "Build and test" is a required check,
  # so it's skipped rather than left out: a skipped job counts as passing.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.files.outputs.build }}
    steps:
      # The PR's merge commit and its first parent, the tip of main.
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check changed files
        id: files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          docs='(\.md$|^LICENSE$|^licenses/|^\.markdownlint-cli2\.jsonc$|^\.github/CODEOWNERS$|^\.github/ISSUE_TEMPLATE/|^\.github/workflows/repository-hygiene\.yml$)'
          if echo "$changed" | grep -qvE "$docs"; then build=true; else build=false; fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails if gradle-wrapper.jar doesn't match a published Gradle release.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Restores dependencies, compiled build logic, the build cache and
      # Robolectric's Android jars. The key changes with the build setup, and
      # the restore keys fall back to the newest entry when it does. Only main
      # saves, so every PR can read the entry.
      - name: Restore Gradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'gradle.properties', '**/*.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'gradle.properties', '**/*.gradle.kts') }}-
            gradle-${{ runner.os }}-

      # The active release channel comes from the CHANNEL repository variable
      # (ADR 0008). Changing it moves CI to another channel.
      - name: Pick release channel
        env:
          CHANNEL: ${{ vars.CHANNEL || 'alpha' }}
        run: |
          case "$CHANNEL" in
            alpha | beta | stable) ;;
            *) echo "::error::CHANNEL must be alpha, beta or stable, not '$CHANNEL'."; exit 1 ;;
          esac
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "VARIANT=${CHANNEL^}" >> "$GITHUB_ENV"
          echo "Release channel: $CHANNEL" | tee -a "$GITHUB_STEP_SUMMARY"

      # Runs spotless, lint and the JVM tests, and builds the debug APKs for
      # testing, all for the active channel only. `check` and `assembleDebug`
      # would cover every channel and take much longer. The fanart.tv, TMDB and
      # OMDb keys are only built into the APKs (ADR 0011, ADR 0012, ADR 0014);
      # tests and PRs without them still pass. Publishing the extension API to
      # the local Maven folder checks its release setup.
      - name: Build
        env:
          FANART_TV_API_KEY: ${{ secrets.FANART_TV_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: >-
          ./gradlew spotlessCheck :shared:check :extension-api:check :extension-api:publishToMavenLocal
          :app-tv:lint${VARIANT}Debug :app-tv:test${VARIANT}DebugUnitTest
          :app-tv:assemble${VARIANT}Debug
          :app-companion:lint${VARIANT}Debug :app-companion:test${VARIANT}DebugUnitTest
          :app-companion:assemble${VARIANT}Debug
          :demo-source:testDebugUnitTest :demo-source:assembleDebug

      # Release builds go through R8, which can break a build that debug
      # builds miss. PRs skip this to stay quick; main runs catch it.
      - name: Build release APKs
        if: github.event_name != 'pull_request'
        env:
          FANART_TV_API_KEY: ${{ secrets.FANART_TV_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: ./gradlew :app-tv:assemble${VARIANT}Release :app-companion:assemble${VARIANT}Release

      # Lock files would stop the next run from reusing the cache.
      - name: Prepare Gradle cache
        if: success() && github.ref == 'refs/heads/main'
        run: |
          ./gradlew --stop
          rm -f ~/.gradle/caches/modules-2/modules-2.lock ~/.gradle/caches/modules-2/gc.properties
          find ~/.gradle/caches -name '*.lock' -delete

      - name: Save Gradle cache
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'gradle.properties', '**/*.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 7

      - name: Upload TV debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saikou-neo-tv-${{ env.CHANNEL }}-debug
          path: app-tv/build/outputs/apk/${{ env.CHANNEL }}/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload companion debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saikou-neo-companion-${{ env.CHANNEL }}-debug
          path: app-companion/build/outputs/apk/${{ env.CHANNEL }}/debug/*.apk
          if-no-files-found: error
          retention-days: 7
