name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails if gradle-wrapper.jar doesn't match a published Gradle release.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Runs lint and the JVM tests, builds the debug APKs for testing, and
      # builds one shrunk release APK for the size check below. `build` would
      # assemble every channel and build type, which takes several times longer.
      - name: Build
        run: ./gradlew check :app-tv:assembleDebug :app-companion:assembleDebug :app-tv:assembleAlphaRelease

      # Fails when the shrunk TV release grows past its budget. If a change
      # needs more room, raise the budget in that PR and say why.
      - name: Check TV APK size
        env:
          BUDGET_BYTES: "2200000"
          APK: app-tv/build/outputs/apk/alpha/release/app-tv-alpha-release-unsigned.apk
        run: |
          size=$(stat -c %s "$APK")
          echo "TV release APK: $size bytes, budget $BUDGET_BYTES bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$BUDGET_BYTES" ]; then
            echo "::error::The TV release APK is $size bytes, over its budget of $BUDGET_BYTES bytes."
            exit 1
          fi

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 14

      - name: Upload TV debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saikou-neo-tv-debug
          path: app-tv/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload companion debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saikou-neo-companion-debug
          path: app-companion/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
