# Adult titles are left out of every catalogue query for now.

fragment AnimeCardFields on Media {
  id
  title {
    romaji
    english
    native
  }
  coverImage {
    extraLarge
    color
  }
  bannerImage
  format
  episodes
  averageScore
  season
  seasonYear
}

query BrowseAnime($page: Int!, $perPage: Int!, $sort: [MediaSort], $season: MediaSeason, $seasonYear: Int) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      hasNextPage
    }
    media(type: ANIME, isAdult: false, sort: $sort, season: $season, seasonYear: $seasonYear) {
      ...AnimeCardFields
    }
  }
}

query SearchAnime($page: Int!, $perPage: Int!, $search: String!) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      hasNextPage
    }
    media(type: ANIME, isAdult: false, search: $search, sort: [SEARCH_MATCH]) {
      ...AnimeCardFields
    }
  }
}

query AnimeDetails($id: Int!) {
  Media(id: $id, type: ANIME) {
    ...AnimeCardFields
    description(asHtml: false)
    status
    duration
    genres
    studios(isMain: true) {
      nodes {
        name
      }
    }
    nextAiringEpisode {
      episode
      airingAt
    }
    relations {
      edges {
        relationType
        node {
          ...AnimeCardFields
          type
          isAdult
        }
      }
    }

    # The ones AniList's users rate best first. More can be paged with AnimeRecommendations.
    recommendations(sort: [RATING_DESC], perPage: 10) {
      pageInfo {
        hasNextPage
      }
      nodes {
        mediaRecommendation {
          ...AnimeCardFields
          isAdult
        }
      }
    }
  }
}

# All of an anime's recommendations, a page at a time, and its title to head them.
query AnimeRecommendations($id: Int!, $page: Int!, $perPage: Int!) {
  Media(id: $id, type: ANIME) {
    title {
      romaji
      english
      native
    }
    recommendations(sort: [RATING_DESC], page: $page, perPage: $perPage) {
      pageInfo {
        hasNextPage
      }
      nodes {
        mediaRecommendation {
          ...AnimeCardFields
          isAdult
        }
      }
    }
  }
}

# The story behind each of a few anime, such as the ones in Home's spotlight.
query AnimeSynopses($ids: [Int]!) {
  Page(perPage: 50) {
    media(id_in: $ids, type: ANIME, isAdult: false) {
      id
      description(asHtml: false)
    }
  }
}

# The series an anime belongs to or follows, such as the show a movie comes from or the season before a sequel.
query AnimeRelations($id: Int!) {
  Media(id: $id, type: ANIME) {
    relations {
      edges {
        relationType
        node {
          id
          type
          format
        }
      }
    }
  }
}
