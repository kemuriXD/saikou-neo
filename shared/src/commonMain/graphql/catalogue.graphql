# Adult titles are left out of every catalogue query for now.

fragment AnimeCardFields on Media {
  id
  title {
    romaji
    english
    native
  }
  coverImage {
    extraLarge
    color
  }
  bannerImage
  format
  episodes
  averageScore
  season
  seasonYear
}

query BrowseAnime($page: Int!, $perPage: Int!, $sort: [MediaSort], $season: MediaSeason, $seasonYear: Int) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      hasNextPage
    }
    media(type: ANIME, isAdult: false, sort: $sort, season: $season, seasonYear: $seasonYear) {
      ...AnimeCardFields
    }
  }
}

query SearchAnime($page: Int!, $perPage: Int!, $search: String!) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      hasNextPage
    }
    media(type: ANIME, isAdult: false, search: $search, sort: [SEARCH_MATCH]) {
      ...AnimeCardFields
    }
  }
}

query AnimeDetails($id: Int!) {
  Media(id: $id, type: ANIME) {
    ...AnimeCardFields
    description(asHtml: false)
    status
    duration
    genres
    studios(isMain: true) {
      nodes {
        name
      }
    }
    nextAiringEpisode {
      episode
      airingAt
    }
  }
}

# The story behind each of a few anime, such as the ones in Home's spotlight.
query AnimeSynopses($ids: [Int]!) {
  Page(perPage: 50) {
    media(id_in: $ids, type: ANIME, isAdult: false) {
      id
      description(asHtml: false)
    }
  }
}
