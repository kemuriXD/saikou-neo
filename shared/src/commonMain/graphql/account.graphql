# The signed-in user, asked with their token. The phone shows the name and links to the profile page, and the TV
# shows the profile picture.
query Viewer {
  Viewer {
    id
    name
    siteUrl
    avatar {
      large
    }
  }
}

# The shows on a user's Watching and Planning lists, asked with their token so private lists are included. Schedule
# uses it to show only the user's shows.
query WatchList($userId: Int!) {
  MediaListCollection(userId: $userId, type: ANIME, status_in: [CURRENT, PLANNING]) {
    lists {
      isCustomList
      entries {
        status
        media {
          id
          title {
            romaji
            english
            native
          }
          coverImage {
            extraLarge
          }
          status
          nextAiringEpisode {
            episode
          }
        }
      }
    }
  }
}

# A show's episode count and the signed-in user's entry for it, asked before watching updates their progress.
query ListEntry($mediaId: Int!) {
  Media(id: $mediaId, type: ANIME) {
    episodes
    mediaListEntry {
      status
      progress
      startedAt {
        year
      }
    }
  }
}

# Saves the signed-in user's progress in a show, with its status and start date when they change.
mutation SaveProgress($mediaId: Int!, $progress: Int!, $status: MediaListStatus, $startedAt: FuzzyDateInput) {
  SaveMediaListEntry(mediaId: $mediaId, progress: $progress, status: $status, startedAt: $startedAt) {
    id
  }
}
