# The signed-in user, asked with their token. The phone shows the name and links to the profile page, and the TV
# shows the profile picture.
query Viewer {
  Viewer {
    id
    name
    siteUrl
    avatar {
      large
    }
  }
}

# The shows on a user's Watching and Planning lists, asked with their token so private lists are included. Schedule
# uses it to show only the user's shows.
query WatchList($userId: Int!) {
  MediaListCollection(userId: $userId, type: ANIME, status_in: [CURRENT, PLANNING]) {
    lists {
      isCustomList
      entries {
        status
        media {
          id
          title {
            romaji
            english
            native
          }
          coverImage {
            extraLarge
          }
          status
          nextAiringEpisode {
            episode
          }
        }
      }
    }
  }
}

# The signed-in user's Watching and Rewatching progress, asked with their token, for Continue watching. Private entries
# are asked for so they can be left out.
query ContinueList($userId: Int!) {
  MediaListCollection(userId: $userId, type: ANIME, status_in: [CURRENT, REPEATING]) {
    lists {
      isCustomList
      entries {
        progress
        private
        updatedAt
        media {
          id
          duration
        }
      }
    }
  }
}

# A show's episode count, whether it has finished airing and the signed-in user's entry for it, asked before watching
# or the list button updates their list.
# The rest of the entry is read so Undo can put it back.
query ListEntry($mediaId: Int!) {
  Media(id: $mediaId, type: ANIME) {
    episodes
    status
    title {
      romaji
      english
      native
    }
    mediaListEntry {
      id
      status
      progress
      repeat
      score(format: POINT_100)
      notes
      private
      hiddenFromStatusLists
      startedAt {
        year
        month
        day
      }
      completedAt {
        year
        month
        day
      }
    }
  }
}

# Saves the signed-in user's progress in a show, with its status, dates and rewatch count when they change.
mutation SaveProgress(
  $mediaId: Int!
  $progress: Int!
  $status: MediaListStatus
  $startedAt: FuzzyDateInput
  $completedAt: FuzzyDateInput
  $repeat: Int
) {
  SaveMediaListEntry(
    mediaId: $mediaId
    progress: $progress
    status: $status
    startedAt: $startedAt
    completedAt: $completedAt
    repeat: $repeat
  ) {
    id
  }
}

# Takes a show off the signed-in user's list, from the list button.
mutation DeleteEntry($id: Int!) {
  DeleteMediaListEntry(id: $id) {
    deleted
  }
}

# Puts an entry back as it was before a change from the TV, for Undo. A date with no parts clears it.
mutation RestoreEntry(
  $mediaId: Int!
  $status: MediaListStatus!
  $progress: Int!
  $repeat: Int!
  $scoreRaw: Int!
  $notes: String
  $private: Boolean!
  $hidden: Boolean!
  $startedAt: FuzzyDateInput!
  $completedAt: FuzzyDateInput!
) {
  SaveMediaListEntry(
    mediaId: $mediaId
    status: $status
    progress: $progress
    repeat: $repeat
    scoreRaw: $scoreRaw
    notes: $notes
    private: $private
    hiddenFromStatusLists: $hidden
    startedAt: $startedAt
    completedAt: $completedAt
  ) {
    id
  }
}
